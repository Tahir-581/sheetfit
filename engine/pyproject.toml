[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetfit"
version = "0.1.0"
description = "Expand short book PDFs to ~400 pages for 100-sheet duplex print"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "weasyprint>=62.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sheetfit = "sheetfit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sheetfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
